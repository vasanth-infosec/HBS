{% extends 'admin-base.html'%}
{% block title %}
Add Department
{% endblock%}

{% block content %}

<div class="container ">
    <div class="row justify-content-center g-5">
        <div class="col-xl-5 col-md-8">
            <div class="department-card p-5 mt-5">
                <div class="d-flex flex-column gap-3">
                    <h3 class="fw-bold text-center mb-3">Add Department</h3>
                    <form action="{% url 'add-department-data' %}" method="post" id="departmentForm">
                        {% csrf_token %}
                        <div class="d-flex flex-column gap-3">
                            <div class="d-flex flex-column gap-3">
                                <label for="" class="fw-bold">Department Name </label>
                                <input type="text" name="dep" id="dept" class="px-3 py-1 rounded-3 "
                                    placeholder="Enter Department Name" required>
                                <span class="text-danger" id="deptError"></span>
                            </div>
                            <div class="d-flex flex-column gap-3">
                                <label for="" class="fw-bold">Description </label>
                                <input type="text" name="desc" id="descp" class="px-3 py-1 rounded-3 "
                                    placeholder="Enter the Description" required>
                                <span class="text-danger" id="descpError"></span>
                            </div>
                            <button type="submit" class="btn btn-primary ">Add</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% for message in messages %}
<script>
        alert("{{ message }}");
</script>
{% endfor %}
{% endblock %}
