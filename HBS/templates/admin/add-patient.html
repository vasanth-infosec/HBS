
{% extends 'admin-base.html' %}

{% load static %}

{% block title %}
Add Patient
{% endblock %}

{% block content %}
 
<div class="container">
    <div class="">

        <div class="row justify-content-center">
            <div class="col-xl-8 ">
                <div class="register px-5 py-4">
                    <h2 class="text-center fw-bold mb-5">Add Patient</h2>
                    <form method="post" action="{% url 'add-patient-register-data' %}" id="patientForm" enctype="multipart/form-data"> 
                        {% csrf_token %}
                        <div class="row justify-content-center g-3">
                            <div class="col-xl-6">

                                <div class="d-flex flex-column gap-3 ">
                                    <label for="" class="fw-bold">First Name </label>
                                    <input type="text" placeholder="Enter the First Name" class="rounded-3 px-3 py-1"
                                        id="fname" name="fname" required>
                                    <span id="fnameError" class="text-danger"></span>
                                </div>
                            </div>
                            <div class="col-xl-6">
                                <div class="d-flex flex-column gap-3 ">
                                    <label for="" class="fw-bold">Last Name </label>
                                    <input type="text" placeholder="Enter the Last Name " class="rounded-3 px-3 py-1"
                                        id="lname" name="lname"  required >
                                    <span id="lnameError"></span>
                                </div>
                            </div>
                            <div class="col-xl-6">
                                <div class="d-flex flex-column gap-3 ">

                                    <label for="" class="fw-bold">Data of Birth</label>
                                    <input type="date" name="dob" class="rounded-3 px-3 py-1" required>
                                </div>
                            </div>
                            <div class="col-xl-6">
                                <div class="d-flex flex-column gap-3 ">

                                    <label for="" class="fw-bold">Gender</label>
                                    <select name="gender" id="" class="rounded-3 px-3 py-1 border-3">
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Others">Others</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-xl-6">
                                <div class="d-flex flex-column gap-3 ">

                                    <label for="" class="fw-bold">Blood Group</label>
                                    <select name="blood" id="" class="rounded-3 px-3 py-1 border-3">
                                        <option value="A+">A+</option>
                                        <option value="A-">A-</option>
                                        <option value="B+">B+</option>
                                        <option value="B-">B-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="AB-">AB-</option>
                                        <option value="O+">O+</option>
                                        <option value="O-">O-</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-xl-6">
                                <div class="d-flex flex-column gap-3 ">

                                    <label for="" class="fw-bold">Address </label>
                                    <input type="text" placeholder="Enter the Address" class="rounded-3 px-3 py-1"
                                        id="address" name="address" required>
                                    <span id="addressError" class="text-danger"></span>
                                </div>
                            </div>
                            <div class="col-xl-6">
                                <div class="d-flex flex-column gap-3 ">

                                    <label for="" class="fw-bold">Phone Number </label>
                                    <input type="tel" placeholder="Enter the Phone Number" class="rounded-3 px-3 py-1"
                                        id="phone" name="phone"  required>
                                    <span id="phoneError" class="text-danger"></span>
                                </div>
                            </div>
                            <div class="col-xl-6">
                                <div class="d-flex flex-column gap-3 ">

                                    <label for="" class="fw-bold">Email </label>
                                    <input type="email" placeholder="Enter the Email" class="rounded-3 px-3 py-1"
                                       id="email" name="email" required>
                                    <span id="emailError" class="text-danger"></span>
                                </div>
                            </div>
                            <div class="col-xl-6">
                                <div class="d-flex flex-column gap-3 ">
                                    <label for="" class="fw-bold">Username </label>
                                    <input type="text" placeholder="Entet the Username" class="rounded-3 px-3 py-1"
                                       id="username" name="username" required>
                                    <span id="usernameError" class="text-danger"></span>
                                </div>
                            </div>
                            <div class="col-xl-6">
                                <div class="d-flex flex-column gap-3">

                                    <label for="file" class="fw-bold">Profile Image</label>
                                    <input type="file" name="file" class="image-b  rounded-3" accept="image/*" id="image">
                                    <span id="imageError" class="text-danger"></span>
                                </div>
                            </div>
                        </div>

                        <div class="">

                            <button type="submit" class="btn btn-primary fw-bold mt-3 ">Add</button>

                        </div>
                    </form>

                </div>
            </div>


        </div>
    </div>
</div>
</div>
{% for message in messages %}
<script>
    alert("{{message}}")
</script>
{% endfor %}
{% endblock %}
